[versions]
agp = "8.9.1"
coilNetworkOkhttp = "3.1.0"
converterGson = "2.11.0"
coreTesting = "2.2.0"
koinAndroid = "4.0.1"
koinAndroidxCompose = "3.5.0"
kotlin = "2.0.21"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
kotlinxCoroutinesAndroid = "1.10.1"
kotlinxCoroutinesCore = "1.10.1"
kotlinxCoroutinesTest = "1.10.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.10.1"
